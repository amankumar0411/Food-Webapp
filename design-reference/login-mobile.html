<script>
  function switchAuthTab(mode) {
    const tabOtp = document.getElementById('tabOtp');
    const tabEmail = document.getElementById('tabEmail');
    const otpView = document.getElementById('otpInputView');
    const emailView = document.getElementById('emailInputView');

    if (mode === 'otp') {
      tabOtp.classList.add('bg-surface-container-lowest', 'text-charcoal-ink', 'shadow-sm', 'font-semibold');
      tabOtp.classList.remove('bg-transparent', 'text-on-surface-variant');
      tabOtp.setAttribute('aria-selected', 'true');

      tabEmail.classList.remove('bg-surface-container-lowest', 'text-charcoal-ink', 'shadow-sm', 'font-semibold');
      tabEmail.classList.add('bg-transparent', 'text-on-surface-variant');
      tabEmail.setAttribute('aria-selected', 'false');

      otpView.classList.remove('hidden');
      emailView.classList.add('hidden');
    } else {
      tabEmail.classList.add('bg-surface-container-lowest', 'text-charcoal-ink', 'shadow-sm', 'font-semibold');
      tabEmail.classList.remove('bg-transparent', 'text-on-surface-variant');
      tabEmail.setAttribute('aria-selected', 'true');

      tabOtp.classList.remove('bg-surface-container-lowest', 'text-charcoal-ink', 'shadow-sm', 'font-semibold');
      tabOtp.classList.add('bg-transparent', 'text-on-surface-variant');
      tabOtp.setAttribute('aria-selected', 'false');

      emailView.classList.remove('hidden');
      otpView.classList.add('hidden');
    }
  }

  function fillVipDemo() {
    const mobileInput = document.getElementById('mobileInput');
    const emailField = document.getElementById('emailField');
    
    if (mobileInput) {
      mobileInput.value = "98201 88942";
      mobileInput.classList.add('bg-secondary-container/20');
      setTimeout(() => mobileInput.classList.remove('bg-secondary-container/20'), 500);
    }
    if (emailField) {
      emailField.value = "sommelier.vip@zayka.kitchen";
    }
  }

  function triggerPasscodeFeedback() {
    const btnText = document.getElementById('btnText');
    const orig = btnText.innerText;
    btnText.innerText = 'DISPATCHING CRYPTO-KEY...';
    setTimeout(() => {
      btnText.innerText = 'PASSCODE DISPATCHED ✓';
      setTimeout(() => {
        btnText.innerText = orig;
      }, 2000);
    }, 800);
  }
